<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrduStack Playground</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #1f2937; }
    h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
    .subtitle { color: #6b7280; margin-bottom: 1.5rem; }
    textarea { width: 100%; min-height: 100px; padding: 0.75rem; font-size: 1rem; border: 1px solid #d1d5db; border-radius: 0.5rem; resize: vertical; }
    button { margin-top: 0.75rem; padding: 0.6rem 1.2rem; font-size: 1rem; background: #2563eb; color: white; border: none; border-radius: 0.5rem; cursor: pointer; }
    button:disabled { background: #93c5fd; cursor: wait; }
    .result { margin-top: 1.5rem; padding: 1rem; background: #f9fafb; border-radius: 0.5rem; border: 1px solid #e5e7eb; }
    .result h3 { margin-top: 0; font-size: 1rem; color: #374151; }
    .score { font-size: 1.5rem; font-weight: 700; }
    .score.high { color: #dc2626; }
    .score.medium { color: #d97706; }
    .score.low { color: #16a34a; }
    .phrase { display: inline-block; padding: 0.25rem 0.5rem; margin: 0.25rem 0.25rem 0 0; background: #fee2e2; color: #991b1b; border-radius: 9999px; font-size: 0.875rem; }
    .feedback { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #e5e7eb; }
    .feedback select, .feedback textarea { width: 100%; margin-top: 0.5rem; padding: 0.5rem; font-size: 0.95rem; border: 1px solid #d1d5db; border-radius: 0.375rem; }
    .feedback button { background: #4b5563; }
    .feedback button:disabled { background: #9ca3af; }
    .loading { color: #6b7280; }
    .error { color: #dc2626; }
    .success { color: #16a34a; }
  </style>
</head>
<body>
  <h1>UrduStack Playground</h1>
  <p class="subtitle">Mixed Urdu / Roman Urdu / English → normalized Urdu + explainable risk score</p>

  <textarea id="input" placeholder="yar mujhe pareshan mat karo bro...">job available, 50000 per week, send processing fee</textarea>
  <br>
  <button id="analyze" onclick="analyze()">Analyze</button>

  <div id="output" class="result" style="display:none;"></div>

  <script>
    let lastResult = null;

    async function analyze() {
      const text = document.getElementById('input').value.trim();
      const out = document.getElementById('output');
      const btn = document.getElementById('analyze');
      if (!text) { out.style.display = 'block'; out.innerHTML = '<p class="error">Please enter some text.</p>'; return; }

      btn.disabled = true;
      out.style.display = 'block';
      out.innerHTML = '<p class="loading">Analyzing...</p>';

      try {
        const [normRes, riskRes] = await Promise.all([
          fetch('/normalize', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({text}) }),
          fetch('/risk-score', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({text}) })
        ]);
        if (!normRes.ok || !riskRes.ok) throw new Error('API request failed');
        const norm = await normRes.json();
        const risk = await riskRes.json();
        lastResult = { text, norm, risk };

        const phrases = risk.flagged_phrases.map(p => `<span class="phrase">${p.phrase} (${p.contribution.toFixed(2)})</span>`).join('');
        const feedbackHtml = risk.confidence < 0.7 ? feedbackForm() : '';
        out.innerHTML = `
          <h3>Normalized</h3>
          <p dir="rtl" style="font-size:1.1rem;">${norm.normalized}</p>
          <p><small>Confidence: ${norm.confidence.toFixed(2)}</small></p>

          <h3>Risk Assessment</h3>
          <p class="score ${risk.risk_level}">${risk.score.toFixed(2)} — ${risk.risk_level.toUpperCase()}</p>
          <p><strong>Confidence:</strong> ${risk.confidence.toFixed(2)}</p>
          <p>${risk.explanation}</p>

          <h3>Flagged Phrases</h3>
          <div>${phrases || '<span style="color:#6b7280;">None</span>'}</div>
          ${feedbackHtml}
        `;
      } catch (err) {
        out.innerHTML = `<p class="error">Error: ${err.message}</p>`;
      } finally {
        btn.disabled = false;
      }
    }

    function feedbackForm() {
      return `
        <div class="feedback">
          <h3>Was this correct?</h3>
          <label>Correct label:
            <select id="fb-label">
              <option value="correct">Correct</option>
              <option value="low_risk">Should be low risk</option>
              <option value="medium_risk">Should be medium risk</option>
              <option value="high_risk">Should be high risk</option>
              <option value="spam">Spam / scam</option>
              <option value="not_spam">Not spam / scam</option>
            </select>
          </label>
          <textarea id="fb-comment" placeholder="Optional comment (e.g., context, dialect, false flag...)"></textarea>
          <button onclick="submitFeedback()">Submit feedback</button>
          <p id="fb-status"></p>
        </div>
      `;
    }

    async function submitFeedback() {
      if (!lastResult) return;
      const status = document.getElementById('fb-status');
      const btn = document.querySelector('.feedback button');
      btn.disabled = true;
      status.textContent = 'Sending...';
      try {
        const res = await fetch('/feedback', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            text: lastResult.text,
            normalized: lastResult.norm.normalized,
            score: lastResult.risk.score,
            confidence: lastResult.risk.confidence,
            correct_label: document.getElementById('fb-label').value,
            comment: document.getElementById('fb-comment').value
          })
        });
        if (!res.ok) throw new Error('Failed to submit');
        status.className = 'success';
        status.textContent = 'Thanks — your feedback has been logged for retraining.';
      } catch (err) {
        status.className = 'error';
        status.textContent = 'Error: ' + err.message;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
