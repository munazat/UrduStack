<svg viewBox="0 0 1500 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1500" height="900" fill="#ffffff"/>
  <text x="750" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">Risk Scoring — the Max-Ensemble, in Detail</text>
  <text x="750" y="70" text-anchor="middle" font-size="15" fill="#6b7280">Two independent detectors, combined so either one catching a threat is enough</text>

  <!-- Input -->
  <rect x="560" y="100" width="380" height="56" rx="10" fill="#111827"/>
  <text x="750" y="134" text-anchor="middle" fill="white" font-size="14" font-family="Consolas, monospace">"job available 50000 per week send processing fee"</text>

  <path d="M700 156 L 400 210" stroke="#374151" stroke-width="2.5" marker-end="url(#a4)"/>
  <path d="M800 156 L 1100 210" stroke="#374151" stroke-width="2.5" marker-end="url(#a4)"/>

  <!-- LEFT: LoRA branch -->
  <rect x="140" y="216" width="530" height="380" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="405" y="248" text-anchor="middle" font-size="18" font-weight="700" fill="#7f1d1d">Branch A — LoRA XLM-RoBERTa</text>
  <text x="405" y="270" text-anchor="middle" font-size="12.5" fill="#991b1b">Semantic understanding — generalizes to unseen vocabulary</text>

  <rect x="170" y="288" width="470" height="52" rx="8" fill="#ffffff" stroke="#fecaca"/>
  <text x="405" y="310" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">Base model: xlm-roberta-base (270M params)</text>
  <text x="405" y="328" text-anchor="middle" font-size="11.5" fill="#6b7280">Fine-tuned with LoRA — r=16, α=32, 4.5 MB adapter</text>

  <rect x="170" y="350" width="470" height="52" rx="8" fill="#ffffff" stroke="#fecaca"/>
  <text x="405" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">Trained on ~80k labeled rows</text>
  <text x="405" y="390" text-anchor="middle" font-size="11.5" fill="#6b7280">PURUTT (72.7k) + synthetic scam (1.5k) + supplementary, class-weighted</text>

  <rect x="170" y="412" width="470" height="52" rx="8" fill="#ffffff" stroke="#fecaca"/>
  <text x="405" y="434" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">Temperature-calibrated: T = 1.409</text>
  <text x="405" y="452" text-anchor="middle" font-size="11.5" fill="#6b7280">Grid search over 100 values — confidence isn't just softmax overconfidence</text>

  <rect x="170" y="474" width="470" height="100" rx="8" fill="#ffffff" stroke="#fecaca"/>
  <text x="405" y="498" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">Verified real generalization (2026-09-07)</text>
  <text x="190" y="520" font-size="12" fill="#374151">On 11 phrases matching ZERO heuristic keywords —</text>
  <text x="190" y="538" font-size="12" fill="#374151">7 correctly caught (novel insults, investment scams,</text>
  <text x="190" y="556" font-size="12" fill="#374151">bank-transfer instructions). 4 still missed.</text>

  <!-- RIGHT: Heuristic branch -->
  <rect x="830" y="216" width="530" height="380" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="1095" y="248" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Branch B — 5-Pass Heuristic</text>
  <text x="1095" y="270" text-anchor="middle" font-size="12.5" fill="#1e40af">Fast, deterministic, catches obfuscation of KNOWN terms</text>

  <rect x="860" y="288" width="470" height="52" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="1095" y="310" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Pass 1-2: word-boundary + leetspeak</text>
  <text x="1095" y="328" text-anchor="middle" font-size="11.5" fill="#6b7280">"pr0c3ss1ng f33" → decoded before matching</text>

  <rect x="860" y="350" width="470" height="52" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="1095" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Pass 3: typo correction</text>
  <text x="1095" y="390" text-anchor="middle" font-size="11.5" fill="#6b7280">Known misspelling map — "procesing" → "processing"</text>

  <rect x="860" y="412" width="470" height="52" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="1095" y="434" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Pass 4: fuzzy character-spacing</text>
  <text x="1095" y="452" text-anchor="middle" font-size="11.5" fill="#6b7280">"k u t t a" evasion — detected and collapsed</text>

  <rect x="860" y="474" width="470" height="100" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="1095" y="498" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Pass 5: Levenshtein fuzzy match</text>
  <text x="880" y="520" font-size="12" fill="#374151">Generalizes to NOVEL misspellings of known</text>
  <text x="880" y="538" font-size="12" fill="#374151">words/phrases — not an enumerated list,</text>
  <text x="880" y="556" font-size="12" fill="#374151">genuine edit-distance matching.</text>

  <!-- Combine -->
  <path d="M405 596 L 700 660" stroke="#374151" stroke-width="2.5" marker-end="url(#a4)"/>
  <path d="M1095 596 L 800 660" stroke="#374151" stroke-width="2.5" marker-end="url(#a4)"/>

  <rect x="540" y="668" width="420" height="90" rx="12" fill="#111827"/>
  <text x="750" y="700" text-anchor="middle" fill="white" font-size="16" font-weight="700">score = max(lora_score, heuristic_score)</text>
  <text x="750" y="726" text-anchor="middle" fill="#d1d5db" font-size="12.5">Either branch catching it is enough — verified 8 of 12</text>
  <text x="750" y="744" text-anchor="middle" fill="#d1d5db" font-size="12.5">red-team cases driven by the LoRA model independently</text>

  <path d="M750 758 L 750 790" stroke="#374151" stroke-width="2.5" marker-end="url(#a4)"/>

  <rect x="500" y="796" width="500" height="70" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="750" y="826" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">score = 1.00 → HIGH RISK</text>
  <text x="750" y="848" text-anchor="middle" font-size="12" fill="#991b1b">Threat: Fake Job Posting · debug_scores exposed via API for transparency</text>
</svg>
